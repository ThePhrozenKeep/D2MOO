name: Score with reccmp
description: Run reccmp comparison and generate reports

inputs:
  source-root:
    description: Directory with reccmp-project.yml and sources
    required: true
    default: '.'
  recompiled:
    description: Directory with our binaries and PDBs
    required: true
  original:
    description: Directory with original binaries
    required: true
    default: 'originals'
  suffix:
    description: Report name suffix
    default: ''

runs:
  using: composite
  steps:
    - name: Install reccmp
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install reccmp pyyaml colorama

    - name: Create reccmp-user.yml
      shell: bash
      working-directory: ${{ inputs.source-root }}
      run: |
        cat > reccmp-user.yml << YML
        targets:
          D2COMMON:
            path: ${{ github.workspace }}/${{ inputs.original }}/D2Common.dll
          D2GAME:
            path: ${{ github.workspace }}/${{ inputs.original }}/D2Game.dll
          D2LANG:
            path: ${{ github.workspace }}/${{ inputs.original }}/D2Lang.dll
          D2WIN:
            path: ${{ github.workspace }}/${{ inputs.original }}/D2Win.dll
          D2GFX:
            path: ${{ github.workspace }}/${{ inputs.original }}/D2gfx.dll
          D2NET:
            path: ${{ github.workspace }}/${{ inputs.original }}/D2Net.dll
          D2CMP:
            path: ${{ github.workspace }}/${{ inputs.original }}/D2CMP.dll
          GAME:
            path: ${{ github.workspace }}/${{ inputs.original }}/Game.exe
        YML

    - name: Run reccmp
      shell: bash
      working-directory: ${{ inputs.source-root }}
      run: |
        python3 tools/run_reccmp.py --all 2>&1 | tail -80
