name: Reccmp CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  ACCURACY_REPORT_BRANCH: accuracy-thing

jobs:
  reccmp:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: vc6-1.10f
        max-size: 1G

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install reccmp
      run: |
        pip install "reccmp==0.1.7" pyyaml colorama

    # reccmp 0.1.7 over-reads the export name table (it decodes with
    # NumberOfFunctions instead of NumberOfNames) and crashes on the retail
    # DLLs. Upstream still has the bug. Remove this step and
    # .github/patches/reccmp-exports.patch once upstream is fixed.
    - name: Patch reccmp export-table bug
      shell: pwsh
      run: |
        $sp = python -c "import reccmp, os; print(os.path.dirname(os.path.dirname(reccmp.__file__)))"
        git apply -p1 --directory="$sp" --unsafe-paths .github/patches/reccmp-exports.patch

    - name: Fetch retail binaries (shallow sparse clone)
      shell: pwsh
      run: |
        git clone --depth 1 --filter=blob:none --sparse https://github.com/ChaosMarc/D2VersionChanger.git D2VersionChanger
        git -C D2VersionChanger sparse-checkout set VersionChanger/LoD/1.10
        New-Item -ItemType Directory -Force -Path originals | Out-Null
        Copy-Item -Path "D2VersionChanger/VersionChanger/LoD/1.10/*" -Destination "originals/" -Recurse -Force

    - name: Create reccmp-user.yml
      run: |
        $content = @"
        targets:
          D2COMMON:
            path: ${{ github.workspace }}/originals/D2Common.dll
          D2GAME:
            path: ${{ github.workspace }}/originals/D2Game.dll
          D2LANG:
            path: ${{ github.workspace }}/originals/D2Lang.dll
          D2WIN:
            path: ${{ github.workspace }}/originals/D2Win.dll
          D2GFX:
            path: ${{ github.workspace }}/originals/D2gfx.dll
          D2NET:
            path: ${{ github.workspace }}/originals/D2Net.dll
          D2CMP:
            path: ${{ github.workspace }}/originals/D2CMP.dll
          GAME:
            path: ${{ github.workspace }}/originals/Game.exe
        "@
        Set-Content -Path "reccmp-user.yml" -Value $content

    # The toolchain (cmake/toolchains/VCPP6.cmake) expects the VC6 (VC98) tree at
    # C:\MSVC600\VC98, with the shared Common\MSDev98 tools sitting alongside it.
    - name: Fetch MSVC 6.0 SP5 toolchain
      shell: pwsh
      run: |
        git -c core.autocrlf=false clone --depth 1 https://github.com/Purplesmaug96/MSVC600.git C:\MSVC600
        if (-not (Test-Path "C:\MSVC600\VC98\Bin\cl.exe")) {
          throw "MSVC600 clone did not produce C:\MSVC600\VC98\Bin\cl.exe"
        }
        Get-Item "C:\MSVC600\VC98\Bin\cl.exe" | Select-Object FullName, Length

    - name: Build with VC6
      run: |
        $env:VCPP6_ROOT = "C:\MSVC600\VC98"
        cmake --preset VC6 -DD2MOO_ORDINALS_VERSION="1.10f" -DD2MOO_NO_BUG_FIX=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
        cmake --build --preset VC6

    - name: Run reccmp
      run: |
        python tools/run_reccmp.py --all --json-dir reccmp-json --html-dir reccmp-html --svg-dir reccmp-svg --copy-builds reccmp-builds 2>&1 | tee reccmp-output.txt

    - name: Check for accuracy regressions
      uses: ./.github/actions/reccmp-regression

    - name: Upload reccmp results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reccmp-results
        path: |
          reccmp-output.txt
          reccmp-data/*.csv

    - name: Upload reccmp JSON reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reccmp-json
        path: reccmp-json/*.json
        if-no-files-found: warn

    - name: Upload reccmp HTML reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reccmp-html
        path: |
          reccmp-html/*.html
          reccmp-svg/*.svg
        if-no-files-found: warn

    - name: Upload compared binaries
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reccmp-builds
        path: reccmp-builds/*
        if-no-files-found: warn

    # Publish the accuracy report to a stable URL. README.md embeds the
    # .../accuracy-report/<TARGET>.svg badges (each linking .../<TARGET>.html), and
    # the compared binaries are linked via nightly.link, so the README never has
    # to change. This runs for pushes and manual runs (not PRs) of the chosen
    # branch and only after the regression gate passed, so a failed run leaves
    # the previous report in place. One-time setup:
    # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
    - name: Build accuracy site
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', env.ACCURACY_REPORT_BRANCH)
      run: |
        python tools/reccmp_site.py `
          --json-dir reccmp-json `
          --html-dir reccmp-html `
          --svg-dir reccmp-svg `
          --out-dir _site/accuracy-report `
          --binaries-url "https://nightly.link/${{ github.repository }}/workflows/reccmp-ci/${{ env.ACCURACY_REPORT_BRANCH }}/reccmp-builds.zip" `
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

    - name: Upload accuracy site
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', env.ACCURACY_REPORT_BRANCH)
      uses: actions/upload-artifact@v4
      with:
        name: reccmp-site
        path: _site
        if-no-files-found: error

  # Serve the report from a stable URL:
  # https://<owner>.github.io/<repo>/accuracy-report/
  # (one-time setup: Settings -> Pages -> Source: GitHub Actions). The Pages
  # packaging happens here on Linux because actions/upload-pages-artifact
  # relies on GNU tar.
  deploy:
    needs: reccmp
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', env.ACCURACY_REPORT_BRANCH)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download accuracy site
        uses: actions/download-artifact@v4
        with:
          name: reccmp-site
          path: _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
